[package]
name = "hex-mem-cp"
version = "0.1.0"
edition = "2021"
description = "Agent long-term memory MCP server backed by HelixDB"
license = "MIT"
repository = "https://github.com/stuarch/hex-mem-cp"

[[bin]]
name = "hex-mem-cp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.2", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
